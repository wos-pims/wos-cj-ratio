<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app_title"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://unpkg.com/i18next@23.10.0/dist/umd/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2.5.0/i18nextHttpBackend.min.js"></script>
    <script src="https://unpkg.com/i18next-browser-languagedetector@7.2.0/i18nextBrowserLanguageDetector.min.js"></script>

    <style>
        :root { --bg-color: #f8f9fa; --text-color: #212529; }
        body.dark-mode { --bg-color: #121212; --text-color: #e0e0e0; background-color: var(--bg-color) !important; }
        .dark-mode .card { background-color: #1e1e1e; color: #e0e0e0; border: 1px solid #333; }
        .dark-mode .card-header { background-color: #087990 !important; color: white !important; }
        .dark-mode .form-control { background-color: #2b2b2b; border-color: #444; color: white; }
        .dark-mode .form-control:focus { background-color: #333; color: white; border-color: #0dcaf0; }
        
        body { background-color: var(--bg-color); color: var(--text-color); transition: all 0.3s ease; }
        .container { padding-top: 50px; }
        
        .lang-container { display: flex; align-items: center; gap: 8px; }
        .lang-select { 
            width: 120px !important; 
            padding: 4px 8px; 
            font-size: 0.9rem; 
            cursor: pointer;
        }
        
        .hidden { display: none; }
        .bold-text { font-weight: bold; }
        .theme-toggle { cursor: pointer; font-size: 1.2rem; margin-right: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-lg">
                <div class="card-header bg-info text-dark d-flex justify-content-between align-items-center">
                    <h5 class="mb-0" data-i18n="card_header">...</h5>
                    <div class="lang-container">
                        <span class="theme-toggle" onclick="toggleDarkMode()" id="themeIcon">🌙</span>
                        <select class="form-select lang-select" id="langSelect" onchange="changeLanguage(this.value)">
                            <option value="en">🇺🇸 English</option>
                            <option value="es">🇪🇸 Español</option>
                            <option value="fr">🇫🇷 Français</option>
                            <option value="it">🇮🇹 Italiano</option>
                            <option value="pl">🇵🇱 Polski</option>
                            <option value="tr">🇹🇷 Türkçe</option>
                            <option value="ja">🇯🇵 日本語</option>
                            <option value="zh">🇨🇳 中文</option>
                        </select>
                    </div>
                </div>
                <div class="card-body">
                    <form id="troopForm">
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="queues" class="form-label" data-i18n="label_queues"></label>
                                <input type="number" class="form-control" id="queues" required min="1">
                            </div>
                            <div class="col-6 mb-3">
                                <label for="capacity" class="form-label" data-i18n="label_capacity"></label>
                                <input type="number" class="form-control" id="capacity" required min="10000">
                            </div>
                        </div>
                        <hr>
                        <div class="row mb-3">
                            <div class="col-4">
                                <label for="infantry" class="form-label-compact" data-i18n="label_infantry"></label>
                                <input type="number" class="form-control" id="infantry" required min="0">
                            </div>
                            <div class="col-4">
                                <label for="lancer" class="form-label-compact" data-i18n="label_lancer"></label>
                                <input type="number" class="form-control" id="lancer" required min="0">
                            </div>
                            <div class="col-4">
                                <label for="marksman" class="form-label-compact" data-i18n="label_marksman"></label>
                                <input type="number" class="form-control" id="marksman" required min="0">
                            </div>
                        </div>
                        <div class="row justify-content-center mt-3">
                            <div class="col-6">
                                <button type="button" class="btn btn-warning w-100" id="calculateBtn" data-i18n="btn_check">
                                    ...
                                </button>
                            </div>
                        </div>
                    </form>
                    <div class="mt-4" id="messageArea"></div>
                    <div id="copyArea" class="text-center mt-3 hidden">
                        <button class="btn btn-outline-secondary btn-sm" onclick="copyToClipboard()" id="copyBtn" data-i18n="btn_copy">
                            ...
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentResultText = "";

    i18next
        .use(i18nextHttpBackend)
        .use(i18nextBrowserLanguageDetector)
        .init({
            fallbackLng: 'en',
            backend: { loadPath: './locales/{{lng}}.json' }
        }, function(err, t) {
            loadSavedTroops(); // Load data after translation is ready
            updateContent();
        });

    function updateContent() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            if (el.tagName === 'OPTION') return; // Skip select options to keep flags
            el.innerHTML = i18next.t(el.getAttribute('data-i18n'));
        });
        document.title = i18next.t('app_title');
        document.getElementById('langSelect').value = i18next.language.split('-')[0];
        
        if (currentResultText !== "") {
            calculateDeployment(false); // Refresh text without re-saving
        }
    }

    function changeLanguage(lng) {
        i18next.changeLanguage(lng, updateContent);
    }

    function toggleDarkMode() {
        const body = document.body;
        const icon = document.getElementById('themeIcon');
        body.classList.toggle('dark-mode');
        icon.innerText = body.classList.contains('dark-mode') ? "☀️" : "🌙";
        localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-mode');
        document.getElementById('themeIcon').innerText = "☀️";
    }

    // --- SAVE AND LOAD LOGIC ---
    function saveTroopData() {
        const data = {
            queues: document.getElementById('queues').value,
            capacity: document.getElementById('capacity').value,
            infantry: document.getElementById('infantry').value,
            lancer: document.getElementById('lancer').value,
            marksman: document.getElementById('marksman').value
        };
        localStorage.setItem('wos_troop_data', JSON.stringify(data));
    }

    function loadSavedTroops() {
        const saved = localStorage.getItem('wos_troop_data');
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById('queues').value = data.queues;
            document.getElementById('capacity').value = data.capacity;
            document.getElementById('infantry').value = data.infantry;
            document.getElementById('lancer').value = data.lancer;
            document.getElementById('marksman').value = data.marksman;
            
            // Automatically run calculation if data exists
            if(data.queues && data.capacity) calculateDeployment(false);
        }
    }

    function calculateDeployment(shouldSave = true) {
        const messageArea = document.getElementById('messageArea');
        const copyArea = document.getElementById('copyArea');
        messageArea.innerHTML = '';

        const queues = +document.getElementById('queues').value;
        const capacity = +document.getElementById('capacity').value;
        const infantry = +document.getElementById('infantry').value;
        const lancer = +document.getElementById('lancer').value;
        const marksman = +document.getElementById('marksman').value;

        if (!queues || !capacity) return;

        if (isNaN(queues) || isNaN(capacity) || isNaN(infantry) || isNaN(lancer) || isNaN(marksman) || queues <= 0 || capacity <= 0) {
            messageArea.innerHTML = `<div class="alert alert-warning">${i18next.t('error_invalid')}</div>`;
            return;
        }

        if (shouldSave) saveTroopData();

        const max_capacity = queues * capacity;
        const total_troops = infantry + lancer + marksman;
        let inf_q = 0, lan_q = 0, mar_q = 0;
        let left_lan = '', left_mar = '';

        if (total_troops > max_capacity) {
            messageArea.innerHTML += `<div class="alert alert-info"><strong>${i18next.t('info_title')}:</strong> ${i18next.t('info_text')}</div>`;
        }

        if (infantry >= max_capacity) {
            const excess = (infantry - max_capacity).toLocaleString();
            messageArea.innerHTML += `<div class="alert alert-danger"><strong>${i18next.t('error_title')}:</strong> ${i18next.t('error_infantry_too_much', { count: excess })}</div>`;
        } else {
            inf_q = Math.floor(infantry / queues);
            const lan_cap = max_capacity - infantry;
            if (lancer >= lan_cap) {
                const leftover = (lancer - lan_cap).toLocaleString();
                lan_q = Math.floor(lan_cap / queues);
                left_lan = `(${i18next.t('stay_home_lancer', { count: leftover })})`;
                mar_q = 0;
                left_mar = `(${i18next.t('stay_home_all_marksman')})`;
            } else {
                lan_q = Math.floor(lancer / queues);
                const mar_cap = max_capacity - infantry - lancer;
                if (marksman > mar_cap) {
                    const leftover = (marksman - mar_cap).toLocaleString();
                    mar_q = Math.floor(mar_cap / queues);
                    left_mar = `(${i18next.t('stay_home_marksman', { count: leftover })})`;
                } else {
                    mar_q = Math.floor(marksman / queues);
                }
            }
            
            messageArea.innerHTML += `
                <div class="alert alert-primary mt-3">
                    <u>${i18next.t('result_title')}:</u><br/>
                    ${i18next.t('label_infantry')}: <span class="bold-text">${inf_q.toLocaleString()}</span><br/>
                    ${i18next.t('label_lancer')}: <span class="bold-text">${lan_q.toLocaleString()}</span> ${left_lan}<br/>
                    ${i18next.t('label_marksman')}: <span class="bold-text">${mar_q.toLocaleString()}</span> ${left_mar}
                </div>`;
            
            currentResultText = `${i18next.t('result_title')}:\n` +
                                `${i18next.t('label_infantry')}: ${inf_q.toLocaleString()}\n` +
                                `${i18next.t('label_lancer')}: ${lan_q.toLocaleString()}\n` +
                                `${i18next.t('label_marksman')}: ${mar_q.toLocaleString()}`;
            
            copyArea.classList.remove('hidden');
        }
    }

    document.getElementById('calculateBtn').addEventListener('click', () => calculateDeployment(true));

    function copyToClipboard() {
        navigator.clipboard.writeText(currentResultText).then(() => {
            const btn = document.getElementById('copyBtn');
            const originalText = i18next.t('btn_copy');
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = originalText, 2000);
        });
    }
</script>
</body>
</html>
